modules:
  http_2xx:
    prober: http
    http:
      preferred_ip_protocol: "ip4"
  http_post_2xx:
    prober: http
    http:
      method: POST
  tcp_connect:
    prober: tcp
  pop3s_banner:
    prober: tcp
    tcp:
      query_response:
      - expect: "^+OK"
      tls: true
      tls_config:
        insecure_skip_verify: false
  grpc:
    prober: grpc
    grpc:
      tls: true
      preferred_ip_protocol: "ip4"
  grpc_plain:
    prober: grpc
    grpc:
      tls: false
      service: "service1"
  ssh_banner:
    prober: tcp
    tcp:
      query_response:
      - expect: "^SSH-2.0-"
      - send: "SSH-2.0-blackbox-ssh-check"
  ssh_banner_extract:
    prober: tcp
    timeout: 5s
    tcp:
      query_response:
      - expect: "^SSH-2.0-([^ -]+)(?: (.*))?$"
        labels:
        - name: ssh_version
          value: "${1}"
        - name: ssh_comments
          value: "${2}"
  irc_banner:
    prober: tcp
    tcp:
      query_response:
      - send: "NICK prober"
      - send: "USER prober prober prober :prober"
      - expect: "PING :([^ ]+)"
        send: "PONG ${1}"
      - expect: "^:[^ ]+ 001"
  icmp:
    prober: icmp
  icmp_ttl5:
    prober: icmp
    timeout: 5s
    icmp:
      ttl: 5
  websocket:
    prober: websocket
  http_3xx:
    prober: http
    http:
      preferred_ip_protocol: "ip4"
      enable_http3: true
      enable_http2: false
      valid_http_versions: ["HTTP/3.0"]
  postgresql:
    prober: tcp
    tcp:
      query_response:
      - send: !!binary AAAACATSFi8= # 0x00, 0x00, 0x00, 0x08, 0x04, 0xD2, 0x16, 0x2F - PostgreSQL SSLRequest
      - expect_bytes: S # 0x53 - Reply will be 'S' if SSL is enabled, and 'N' if it is not.
      - starttls: true

  # ===========================================================================
  # Kafka modules. Target = bootstrap server(s): host:port[,host:port...]
  # All modules below use client_library "segmentio" (pure Go, all builds).
  # ===========================================================================

  # PLAINTEXT listener, no authentication.
  kafka_plaintext:
    prober: kafka
    timeout: 10s
    kafka: {}

  # PLAINTEXT, and the probe fails if a topic is missing or the cluster has
  # fewer than 3 brokers.
  kafka_plaintext_checks:
    prober: kafka
    timeout: 10s
    kafka:
      topics: ["orders"]
      min_brokers: 3

  # SASL_PLAINTEXT with SCRAM.
  kafka_sasl_scram:
    prober: kafka
    timeout: 10s
    kafka:
      client_id: blackbox-exporter
      sasl:
        mechanism: SCRAM-SHA-512       # PLAIN | SCRAM-SHA-256 | SCRAM-SHA-512
        username: monitoring
        password_file: /etc/blackbox_exporter/kafka/monitoring.password

  # SASL_SSL with SCRAM, broker certificate from a private CA.
  kafka_sasl_ssl_scram:
    prober: kafka
    timeout: 10s
    kafka:
      client_id: blackbox-exporter
      tls: true
      tls_config:
        ca_file: /etc/blackbox_exporter/kafka/ca.pem
      sasl:
        mechanism: SCRAM-SHA-512
        username: monitoring
        password_file: /etc/blackbox_exporter/kafka/monitoring.password

  # Confluent Cloud: SASL_SSL with PLAIN, public CA (system trust store).
  # username = API key, password_file = file with the API secret.
  kafka_ccloud:
    prober: kafka
    timeout: 10s
    kafka:
      client_id: blackbox-exporter
      tls: true
      sasl:
        mechanism: PLAIN
        username: ABCDEFGHIJKLMNOP
        password_file: /etc/blackbox_exporter/ccloud-api-secret

  # TLS only, broker certificate from a private CA or self-signed.
  # For a self-signed certificate, use that certificate itself as ca_file.
  kafka_tls:
    prober: kafka
    timeout: 10s
    kafka:
      tls: true
      tls_config:
        ca_file: /etc/blackbox_exporter/kafka/ca.pem
        # server_name: kafka.internal.example.com   # if the certificate name differs from the target
        # insecure_skip_verify: true                # last resort: no verification

  # mTLS: the broker demands a client certificate (ssl.client.auth=required).
  kafka_mtls:
    prober: kafka
    timeout: 10s
    kafka:
      tls: true
      tls_config:
        ca_file: /etc/blackbox_exporter/kafka/ca.pem
        cert_file: /etc/blackbox_exporter/kafka/client.pem
        key_file: /etc/blackbox_exporter/kafka/client.key   # PEM, not encrypted

  # ===========================================================================
  # Kafka modules with client_library "confluent" (librdkafka).
  # Only for builds with CGO_ENABLED=1 and -tags confluent (the default of
  # Dockerfile.build). Other builds reject them and do not start: thus they
  # are commented out. To enable them, remove the first "# " of each line
  # below this box.
  # ===========================================================================

