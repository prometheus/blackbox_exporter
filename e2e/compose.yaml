services:
  blackbox:
    # Named here, so testserver and the extra exporters can use the image this build makes.
    image: ${COMPOSE_PROJECT_NAME:?}-blackbox
    build:
      context: ..
      args:
        ARCH: ${E2E_ARCH:?}
    command: ["--config.file=/config/blackbox.yml", "--log.prober=debug"]
    ports:
      - "127.0.0.1::9115"
    volumes:
      - ${E2E_RUN_DIR:?}/config:/config
      - ${E2E_RUN_DIR:?}/certs:/certs:ro
    # ICMP probes need raw sockets.
    cap_add:
      - NET_RAW
    networks: [default, v4only]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9115/-/healthy"]
      interval: 1s
      retries: 30

  testserver:
    # The exporter image has busybox, so testserver needs no image of its own to pull or pin.
    image: ${COMPOSE_PROJECT_NAME:?}-blackbox
    pull_policy: never
    entrypoint: ["/testserver"]
    volumes:
      - ${E2E_RUN_DIR:?}/testserver:/testserver:ro
    networks:
      default: {}
      v4only:
        # Resolves to testserver's IPv4 address only, for IP protocol fallback.
        aliases: [testserver-v4]
    # testserver opens every port before it serves, so one open port means all are.
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "30080"]
      interval: 1s
      retries: 30

networks:
  # Docker picks both subnets, so parallel runs do not clash.
  default:
    enable_ipv6: true
    driver_opts:
      # The over-MTU ICMP case assumes 1500.
      com.docker.network.driver.mtu: "1500"
  v4only:
    enable_ipv6: false
    driver_opts:
      com.docker.network.driver.mtu: "1500"
